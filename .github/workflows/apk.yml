# Costruisce l'applicazione Android per la postazione del museo.
# Non serve installare niente sul tuo computer: la costruzione avviene qui,
# sui computer di GitHub, ogni volta che carichi il sito (o quando la avvii
# a mano da Actions). Alla fine, nella pagina della lavorazione, trovi
# "epigrafi-centuripe-apk" da scaricare: dentro c'e' il file .apk.
name: App Android

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Prendo i file
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparo il sito dentro l'applicazione
        run: |
          set -e
          mkdir -p app-android/app/src/main/assets/sito
          rsync -a --exclude 'app-android' --exclude '.git' --exclude '.github' \
                   --exclude '*.zip' ./ app-android/app/src/main/assets/sito/
          # nella postazione del museo la pagina non deve avere collegamenti
          # verso l'esterno: ne esiste gia' una versione apposta
          if [ -f app-android/offline/index.html ]; then
            cp app-android/offline/index.html app-android/app/src/main/assets/sito/index.html
            [ -f app-android/offline/dati.js ] && cp app-android/offline/dati.js app-android/app/src/main/assets/sito/dati.js
          fi
          rm -f app-android/app/src/main/assets/sito/.nojekyll \
                app-android/app/src/main/assets/sito/.gitattributes
          echo "peso del sito:"; du -sh app-android/app/src/main/assets/sito

      - name: Costruisco
        working-directory: app-android
        run: |
          gradle --version
          gradle assembleDebug --no-daemon --stacktrace

      - name: Raccolgo il pacchetto
        uses: actions/upload-artifact@v4
        with:
          name: epigrafi-centuripe-apk
          path: app-android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
